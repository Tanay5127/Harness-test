apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: cds-127929-test
    namespace: default
  spec:
    replicas: 1
    selector: 
      matchLabels:
        app: cds-127929-test
    template:
      metadata:
        labels:
          app: cds-127929-test
      spec:
        containers:
          - name: nginx
            image: nginx:latest
            ports:
              - containerPort: 80
